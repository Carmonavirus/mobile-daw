name: Build

on:
  push:
  workflow_dispatch:

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the audio engine smoke test
        run: |
          engine-test/build.sh
          # The bundled General MIDI bank, same pinned copy the app build fetches.
          curl -sSfL -o engine-test/out/GeneralUser-GS.sf2 \
            https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/GeneralUser-GS.sf2
          cd engine-test && ./out/enginetest out/GeneralUser-GS.sf2
      - name: Build and run the wavetable synth test (renders every factory preset)
        run: |
          mkdir -p engine-test/out
          g++ -std=c++17 -O2 -Wall -Wextra -Iapp/src/main/cpp \
            engine-test/synth_test.cpp app/src/main/cpp/wavesynth/*.cpp -o engine-test/out/synthtest
          cd engine-test && ./out/synthtest

  apk:
    runs-on: ubuntu-latest
    # Pushes to different branches must not update the release at the same time.
    concurrency: ${{ github.ref_name == 'claude/project-thread-n1suni' && 'synth-apk' || 'publish-apk' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The runner image already ships the Android SDK; Gradle installs the NDK it needs.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-daw-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Keep one always-current APK on the "latest-build" release so it can be
      # installed straight from a phone browser. Feature branches that are still being
      # tried out publish to their own release instead, so they never replace it.
      - name: Publish APK to its release
        # The synth branch is merged into the main work branch before release, so it never publishes.
        if: github.ref_name != 'claude/project-thread-n1suni'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          case "$GITHUB_REF_NAME" in
            claude/project-thread-ht5fxu) tag=sounds-build; title="Sounds test build"; latest="" ;;
            *) tag=latest-build; title="Latest build"; latest="--latest" ;;
          esac
          cp app/build/outputs/apk/debug/app-debug.apk mobile-daw.apk
          notes="Debug build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Updated automatically on every push."
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null; then
            gh release upload "$tag" mobile-daw.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" mobile-daw.apk --target "$GITHUB_SHA" --title "$title" $latest \
              --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi
