name: Web app

# Builds the browser version (web/): the app's C++ audio engine compiled to WebAssembly plus
# the web UI. Pushes to the install branch publish it to GitHub Pages (gh-pages branch).
on:
  push:
    paths:
      - 'web/**'
      - 'app/src/main/cpp/**'
      - 'app/src/main/assets/wavesynth/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compile the audio engine to WebAssembly
        run: web/engine/build.sh
      - name: Test the WebAssembly engine (drums, synths, every wavetable preset)
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Build the web app
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: web/dist

  # The site always shows the install branch, the same code as the latest APK.
  publish:
    needs: build
    if: github.ref_name == 'claude/sample-import'
    runs-on: ubuntu-latest
    concurrency: publish-web
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: site
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Site: https://$(echo ${GITHUB_REPOSITORY_OWNER} | tr A-Z a-z).github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
